<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>mABBAJACK</title>
<style>
  /* Écran de lancement (règle Socle « Splash animé », sobriété des effets : design plat) :
     entrée de l'icône et du nom, filet, sous-titre, puis sortie en zoom arrière */
  :root {
    --surface: #0e1d40;
    --border: rgb(255 255 255 / 8%);
    --cyan: #38bdf8;
    --text: #ffffff;
    --subtle: #d6e2f5;
    --muted: #93a4c3;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  }

  /* fenêtre 500 × 190 : carte 476 × 166 et marge de 12 px */
  .stage {
    position: absolute;
    inset: 12px;
  }

  .card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 0 24px;  /* space-6 : même marge à gauche et à droite */
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    box-sizing: border-box;
  }

  /* ---- Icône ---- */
  .icon {
    flex: 0 0 auto;
    width: 96px;
    height: 96px;
    animation: icon-in 900ms 100ms cubic-bezier(0.34, 1.3, 0.5, 1) both;
  }

  /* ---- Nom ---- */
  .text {
    position: relative;
    flex: 0 1 auto;
    min-width: 0;
  }

  .title {
    display: flex;
    margin: 0;
    font-size: 40px;  /* token Socle size-splash-title : taille fixe, identique dans toutes les applis */
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.5px;
    color: var(--text);
    white-space: nowrap;
  }

  .title span {
    display: inline-block;
    animation: letter-in 500ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
    animation-delay: calc(350ms + var(--i) * 50ms);
  }

  .title .m {
    color: var(--cyan);
  }

  .rule {
    height: 2px;
    margin: 10px 0 9px;
    background: var(--cyan);
    transform-origin: left center;
    animation: rule-in 600ms 900ms cubic-bezier(0.65, 0, 0.35, 1) both;
  }

  .subtitle {
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--subtle);
    white-space: nowrap;
    text-transform: uppercase;
    animation: subtitle-in 600ms 1.1s ease-out both;
  }

  .footer {
    position: absolute;
    right: 18px;
    bottom: 10px;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Sortie : zoom arrière avec rebond (easeInBack) */
  body.leaving .stage {
    animation: leave 600ms cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
  }

  @keyframes leave {
    from { opacity: 1; transform: scale(1); }
    70% { opacity: 1; }
    to { opacity: 0; transform: scale(0.05); }
  }

  @keyframes icon-in {
    from { opacity: 0; transform: scale(0.4) rotate(-90deg); }
    to { opacity: 1; transform: none; }
  }

  @keyframes letter-in {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes rule-in {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @keyframes subtitle-in {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: none; }
  }

  /* Splash fixe, mêmes durées */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <img class="icon" src="{{ICON}}" alt="">
      <div class="text">
        <h1 class="title" aria-label="mABBAJACK">
          <span class="m" style="--i: 0">m</span><span style="--i: 1">A</span><span style="--i: 2">B</span><span style="--i: 3">B</span><span style="--i: 4">A</span><span style="--i: 5">J</span><span style="--i: 6">A</span><span style="--i: 7">C</span><span style="--i: 8">K</span>
        </h1>
        <div class="rule"></div>
        <p class="subtitle" id="subtitle">{{SUBTITLE}}</p>
      </div>
      <div class="footer">{{FOOTER}}</div>
    </div>
  </div>
  <script>
    // Sous-titre traduit trop long : on réduit sa police pour tenir sur une ligne dans la zone utile
    // (carte − 2 × 24 px − logo − écart). Le titre garde sa taille fixe.
    (function () {
      var card = document.querySelector(".card");
      var logo = document.querySelector(".icon");
      var room = card.clientWidth - 2 * 24 - logo.offsetWidth - 24;
      function fit(el, size, min) {
        var spans = el.querySelectorAll("span");
        var all = [el].concat(Array.prototype.slice.call(spans));
        all.forEach(function (n) { n.style.animation = "none"; });  // mesure à l'état final
        while (el.scrollWidth > room && size > min) {
          size -= 0.5;
          el.style.fontSize = size + "px";
        }
        all.forEach(function (n) { n.style.animation = ""; });
      }
      fit(document.getElementById("subtitle"), 12.5, 8);
    })();
    // Appelé par le lanceur à t = 4 s
    window.splashLeave = function () {
      document.body.classList.add("leaving");
    };
  </script>
</body>
</html>
